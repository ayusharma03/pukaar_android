name: Pukaar web

# The rescuer dashboard (pukaar_web/) and the shared server (server/). Separate from the Android
# workflows: Android CI ignores these paths, and Android releases use v* tags while the dashboard
# deploys from web-v* tags.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the dashboard to Firebase Hosting
        type: boolean
        default: false
  push:
    branches: [main, develop]
    tags: ["web-v*"]
    paths:
      - "pukaar_web/**"
      - "server/**"
      - ".github/workflows/pukaar-web.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "pukaar_web/**"
      - "server/**"
      - ".github/workflows/pukaar-web.yml"

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server/functions
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/functions/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Dashboard typecheck, test, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pukaar_web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pukaar_web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy dashboard to Firebase Hosting
    needs: [server, web]
    if: startsWith(github.ref, 'refs/tags/web-v') || inputs.deploy
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: pukaar_web
    env:
      # Repository variables (Settings > Secrets and variables > Actions > Variables).
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pukaar_web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy
        env:
          # A service account JSON with the Firebase Hosting Admin role, stored as a secret.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy \
            --project "$VITE_FIREBASE_PROJECT_ID" --only hosting --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
